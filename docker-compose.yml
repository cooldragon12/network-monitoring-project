# Local development stack. Copy .env.example to .env first.
#
# The LAN scanner worker is NOT in the default stack: on macOS/Windows, Docker
# Desktop runs containers in a VM that cannot see your LAN at layer 2, so run
# the scanner natively (see README). On a Linux host you can instead enable the
# containerised scanner with:  docker compose --profile linux-scanner up

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-netmon}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-netmon}
    CELERY_BROKER_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
    NOTIFY_NTFY_URL: http://ntfy:80
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-netmon}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published on localhost only, so the native scanner worker can reach it.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Published on localhost only, so the native scanner worker can reach it.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    # WEB_BIND=127.0.0.1 keeps it local; set it to this machine's LAN IP to
    # open it from your phone (still login-only; use HTTPS beyond the LAN).
    ports:
      - "${WEB_BIND:-127.0.0.1}:8000:8000"

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:-http://127.0.0.1:8080}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      # Nobody can read or publish without an account/token.
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      # Optional, iOS only: relay a content-free "poll" nudge via ntfy.sh so
      # iPhones get instant push. Leave empty to keep everything local.
      NTFY_UPSTREAM_BASE_URL: ${NTFY_UPSTREAM_BASE_URL:-}
    volumes:
      - ntfy:/var/lib/ntfy
    ports:
      - "${NTFY_BIND:-127.0.0.1}:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://localhost:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    <<: *app
    command: celery -A config worker -Q default -l info

  beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  # Linux hosts only: ARP scanning needs the host's network and raw sockets.
  scanner:
    <<: *app
    profiles: ["linux-scanner"]
    network_mode: host
    cap_add: [NET_RAW, NET_ADMIN]
    user: root
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-netmon}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@127.0.0.1:5432/${POSTGRES_DB:-netmon}
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CACHE_URL: redis://127.0.0.1:6379/1
      NOTIFY_NTFY_URL: http://127.0.0.1:8080
    command: celery -A config worker -Q scanner -c 1 -l info

volumes:
  pgdata:
  ntfy:
